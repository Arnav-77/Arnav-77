<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="70" viewBox="0 0 1040 70" role="img" aria-label="Experience"><defs>
<filter id="glowe" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.6" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="crispe" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="1.1" result="b"/>
<feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="softe" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10"/></filter>
<linearGradient id="neone" x1="0" x2="1"><stop offset="0" stop-color="#c026d3"/><stop offset=".5" stop-color="#7c5cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
<linearGradient id="fadeRe" x1="0" x2="1"><stop offset="0" stop-color="#22d3ee" stop-opacity=".9"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></linearGradient>
<radialGradient id="neb1e" cx="18%" cy="40%" r="60%"><stop offset="0" stop-color="#c026d3" stop-opacity=".16"/><stop offset="1" stop-color="#c026d3" stop-opacity="0"/></radialGradient>
<radialGradient id="neb2e" cx="85%" cy="55%" r="60%"><stop offset="0" stop-color="#22d3ee" stop-opacity=".12"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
<pattern id="hexe" width="28" height="48.5" patternUnits="userSpaceOnUse">
<path d="M14 0 L28 8.08 L28 24.25 L14 32.33 L0 24.25 L0 8.08 Z M14 32.33 L14 48.5" fill="none" stroke="#7c5cff" stroke-opacity=".10" stroke-width="1"/></pattern>
<clipPath id="carde"><rect width="1040" height="70" rx="16"/></clipPath><style>
text{font-family:'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 18s linear infinite}
.spinr{transform-box:fill-box;transform-origin:center;animation:spin 12s linear infinite reverse}
.spinf{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flick{animation:flick 5s steps(1) infinite}@keyframes flick{0%,100%{opacity:1}46%{opacity:.5}47%{opacity:1}}
.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.breathe{animation:breathe 3.2s ease-in-out infinite alternate}@keyframes breathe{from{opacity:.45}to{opacity:1}}
@keyframes in{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}@keyframes glint{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(345px);opacity:0}}</style></defs><g clip-path="url(#carde)"><rect width="1040" height="70" fill="#04050d"/><rect width="1040" height="70" fill="url(#hexe)"/><polygon points="64.0,35.0 54.0,52.3 34.0,52.3 24.0,35.0 34.0,17.7 54.0,17.7" fill="#04050d" stroke="#7c5cff" stroke-width="1.8" filter="url(#glowe)"/><circle cx="44" cy="35" r="27" fill="none" stroke="#7c5cff" stroke-opacity=".5" stroke-dasharray="3 5" class="spin"/><text x="44" y="40" text-anchor="middle" style="fill:#e8f6ff;font-size:14px;font-weight:700">02</text><text x="86" y="43" style="fill:#e8f6ff;font-size:24px;font-weight:800;letter-spacing:7px;animation:in .9s cubic-bezier(.16,1,.3,1) both" filter="url(#crispe)">EXPERIENCE</text><line x1="325.0" y1="35" x2="790" y2="35" stroke="#7c5cff" stroke-opacity=".35"/><rect x="325.0" y="33.5" width="120" height="3" rx="1.5" fill="url(#fadeRe)" filter="url(#glowe)" style="animation:glint 3.2s cubic-bezier(.45,0,.25,1) infinite"/><rect x="802" y="30" width="4" height="10" fill="#7c5cff" opacity=".7" style="animation:blink 0.80s steps(1) infinite"/><rect x="810" y="30" width="4" height="10" fill="#7c5cff" opacity=".7" style="animation:blink 0.93s steps(1) infinite"/><rect x="818" y="30" width="4" height="10" fill="#7c5cff" opacity=".7" style="animation:blink 1.06s steps(1) infinite"/><rect x="826" y="30" width="4" height="10" fill="#7c5cff" opacity=".7" style="animation:blink 1.19s steps(1) infinite"/><rect x="834" y="30" width="4" height="10" fill="#7c5cff" opacity=".7" style="animation:blink 1.32s steps(1) infinite"/><rect x="842" y="30" width="4" height="10" fill="#7c5cff" opacity=".7" style="animation:blink 1.45s steps(1) infinite"/><text x="1010" y="39" text-anchor="end" style="fill:#7c5cff;font-size:11px;letter-spacing:2px">[ 03 MISSIONS ]</text><path d="M6,16 L6,6 L16,6" fill="none" stroke="#22d3ee" stroke-width="1.8" filter="url(#glowe)"/><path d="M1034,16 L1034,6 L1024,6" fill="none" stroke="#22d3ee" stroke-width="1.8" filter="url(#glowe)"/><path d="M6,54 L6,64 L16,64" fill="none" stroke="#22d3ee" stroke-width="1.8" filter="url(#glowe)"/><path d="M1034,54 L1034,64 L1024,64" fill="none" stroke="#22d3ee" stroke-width="1.8" filter="url(#glowe)"/></g><rect x="1" y="1" width="1038" height="68" rx="15" fill="none" stroke="#1a1f3a" stroke-width="1.4"/><rect x="1" y="1" width="1038" height="68" rx="15" fill="none" stroke="url(#neone)" stroke-width="2.2" filter="url(#glowe)" style="stroke-dasharray:266 1954;animation:bde 8s linear infinite"/><style>@keyframes bde{to{stroke-dashoffset:-2220}}</style></svg>